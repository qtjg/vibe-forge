[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vibe-forge"
dynamic = ["version"]
description = "Local-first policy router for coding assistants - routes coding subtasks to the cheapest adequate local LLM via Ollama, fully offline."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mayank Bhaskar" }]
keywords = ["llm", "ollama", "routing", "local-first", "code-assistant", "offline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
    "httpx>=0.27",
    "build>=1.0",
    "twine>=5.0",
]

[project.scripts]
vibeforge = "vibeforge.cli.main:app"

[project.urls]
Homepage = "https://github.com/qtjg/vibe-forge"
Repository = "https://github.com/qtjg/vibe-forge"
Issues = "https://github.com/qtjg/vibe-forge/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "vibeforge.__version__" }

[tool.setuptools.packages.find]
include = ["vibeforge*"]

[tool.setuptools.package-data]
vibeforge = ["data/*.yaml", "dashboard/static/*.html", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]